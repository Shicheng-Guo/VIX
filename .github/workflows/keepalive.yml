name: Repository Keepalive

on:
  schedule:
    # First day of every month at 15:17 UTC
    - cron: "17 15 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update keepalive marker
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
